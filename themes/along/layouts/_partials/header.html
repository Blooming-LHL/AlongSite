<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ "" | relURL }}" aria-label="返回首页">{{ site.Params.brand }}<span aria-hidden="true">。</span></a>
    <nav aria-label="主导航">
      <ul class="nav-list">
        {{ range site.Menus.main }}<li><a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>{{ end }}
      </ul>
    </nav>
  </div>
</header>
