<article class="project-card"><div><div class="card-meta"><span>{{ .Params.status | default "building" }}</span></div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p>{{ with .Params.stack }}<ul class="stack-list">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}</div>{{ with .Params.github }}<a class="project-link" href="{{ . }}" rel="noopener noreferrer">GitHub ↗</a>{{ end }}</article>
