<!doctype html>
<html lang="{{ site.Language.Locale | default "zh-CN" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div class="site-layout">
      <aside class="site-sidebar site-sidebar-left" aria-label="个人导航" data-pagefind-ignore>
        {{ partial "header.html" . }}
      </aside>
      <main id="main-content" class="site-main">{{ block "main" . }}{{ end }}</main>
      <aside class="site-sidebar site-sidebar-right" aria-label="站点信息" data-pagefind-ignore>
        {{ partial "right-sidebar.html" . }}
      </aside>
    </div>
    {{ partial "footer.html" . }}
  </body>
</html>
