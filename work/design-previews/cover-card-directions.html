  #along-cover-designs .al-site { color-scheme: light; --al-ink: #292542; --al-muted: #6c6884; --al-violet: #794ce9; --al-gap: 18px; --al-ratio: 1.33; color: var(--al-ink); font: 14px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: radial-gradient(ellipse at 1% 5%, #bdccfb 0, transparent 43%), radial-gradient(ellipse at 100% 10%, #f3c5e0 0, transparent 39%), radial-gradient(ellipse at 5% 90%, #c8e9e6 0, transparent 50%), radial-gradient(ellipse at 85% 80%, #f8e3c8 0, transparent 48%), #f0edfb; padding: 30px 24px; min-height: 1040px; display: grid; grid-template-columns: 132px minmax(0, 1fr) 156px; gap: 24px; border-radius: 16px; }
  #along-cover-designs .al-site, #along-cover-designs .al-site * { box-sizing: border-box; }
  #along-cover-designs .al-left { padding: 8px 0; }
  #along-cover-designs .al-portrait { width: 76px; height: 76px; position: relative; margin-bottom: 14px; background: var(--al-avatar) center/cover; border: 3px solid #fff; border-radius: 50%; box-shadow: 0 10px 30px #6263a521; }
  #along-cover-designs .al-status { position: absolute; bottom: -4px; right: -9px; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff; background: #eae3fe; font-size: 18px; }
  #along-cover-designs .al-name { font-size: 24px; font-weight: 700; letter-spacing: -.8px; }
  #along-cover-designs .al-dot { color: var(--al-violet); }
  #along-cover-designs .al-sign { font-size: 12px; color: var(--al-muted); margin: 3px 0 28px; }
  #along-cover-designs .al-nav { display: grid; gap: 9px; }
  #along-cover-designs .al-nav span { padding: 10px 13px; border-radius: 12px; }
  #along-cover-designs .al-nav .al-current { color: var(--al-violet); border: 1px solid #fff; background: linear-gradient(130deg, #e8edff, #dddffc); box-shadow: 0 9px 22px #8176ab14; }
  #along-cover-designs .al-social { margin-top: 38px; color: var(--al-muted); font-size: 11px; }
  #along-cover-designs .al-center { min-width: 0; }
  #along-cover-designs .al-inspiration { padding: 22px 25px; border-radius: 23px; border: 1px solid #fff; background: radial-gradient(ellipse at 100% 0%, #e4cdf5 0, transparent 50%), radial-gradient(ellipse at 90% 95%, #fce9d5 0, transparent 55%), #f8f6ff; box-shadow: 0 18px 35px #77729613; }
  #along-cover-designs .al-eyebrow { color: var(--al-violet); font-size: 11px; letter-spacing: 1.5px; font-weight: 600; }
  #along-cover-designs .al-inspiration-top, #along-cover-designs .al-inspiration-bottom { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  #along-cover-designs .al-date { color: var(--al-muted); font-size: 11px; }
  #along-cover-designs .al-quote { font-size: clamp(21px, 2.8vw, 30px); font-weight: 700; line-height: 1.4; letter-spacing: -.7px; margin: 17px 0 24px; }
  #along-cover-designs .al-inspiration-bottom { font-size: 11px; color: var(--al-muted); }
  #along-cover-designs .al-read-random { color: var(--al-violet); }
  #along-cover-designs .al-section-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; margin: 25px 0 17px; }
  #along-cover-designs .al-section-head h2 { margin: 3px 0 0; font-size: 23px; line-height: 1.4; letter-spacing: -.6px; font-weight: 700; }
  #along-cover-designs .al-all { color: var(--al-muted); font-size: 11px; white-space: nowrap; }
  #along-cover-designs .al-flow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--al-gap); align-items: start; }
  #along-cover-designs .al-column { display: grid; gap: var(--al-gap); min-width: 0; align-content: start; }
  #along-cover-designs .al-post { min-width: 0; border: 1px solid #fff; border-radius: 19px; background: linear-gradient(145deg, #fcfbff, #eff6f8); box-shadow: 0 12px 28px #675b7a12; overflow: hidden; }
  #along-cover-designs .al-column:nth-child(2) .al-post { background: linear-gradient(145deg, #fffbfc, #fff0e2); }
  #along-cover-designs .al-post-content { padding: 19px 18px 17px; }
  #along-cover-designs .al-meta { color: var(--al-muted); font-size: 11px; display: flex; flex-wrap: wrap; gap: 5px 10px; }
  #along-cover-designs .al-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; line-height: 1.5; margin: 10px 0 9px; overflow-wrap: anywhere; }
  #along-cover-designs .al-description { font-size: 12px; color: var(--al-muted); margin: 0; }
  #along-cover-designs .al-post-footer { margin-top: 23px; display: flex; justify-content: space-between; gap: 8px; align-items: center; color: var(--al-muted); font-size: 11px; }
  #along-cover-designs .al-read { color: var(--al-ink); white-space: nowrap; }
  #along-cover-designs .al-image { background: var(--al-cover) 50% 50%/cover; aspect-ratio: var(--al-ratio); }
  #along-cover-designs .al-right { padding-top: 8px; min-width: 0; }
  #along-cover-designs .al-search { display: flex; justify-content: space-between; color: var(--al-violet); padding: 12px 13px; background: #fae9f9; border: 1px solid #fff; border-radius: 13px; box-shadow: 0 12px 24px #9b668a15; font-size: 11px; }
  #along-cover-designs .al-side-section { margin-top: 29px; }
  #along-cover-designs .al-side-section h3 { font-size: 11px; letter-spacing: 1px; color: var(--al-violet); margin: 0 0 14px; }
  #along-cover-designs .al-recent { display: grid; gap: 17px; }
  #along-cover-designs .al-recent-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; font-size: 11px; }
  #along-cover-designs .al-recent-item time { color: var(--al-muted); font-size: 10px; padding-top: 1px; }
  #along-cover-designs .al-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  #along-cover-designs .al-tags span { border-radius: 20px; border: 1px solid #fff; padding: 3px 8px; font-size: 10px; color: var(--al-muted); background: #f9ebf2; }
  #along-cover-designs .al-now { padding: 17px 14px; background: linear-gradient(125deg, #efdae8, #dad4f0); border: 1px solid #fff; border-radius: 16px; font-size: 11px; }
  #along-cover-designs .al-now p { margin: 12px 0; color: var(--al-muted); }
  #along-cover-designs .al-poster { min-height: 442px; display: grid; align-items: end; position: relative; isolation: isolate; color: #fff; background: #32374f; }
  #along-cover-designs .al-poster::before { content: ""; position: absolute; z-index: -2; inset: 0; background: var(--al-cover) 44% 50%/cover; }
  #along-cover-designs .al-poster::after { content: ""; position: absolute; z-index: -1; inset: 0; background: linear-gradient(180deg, #171e3000 24%, #1b20384a 48%, #1c2038f0 100%); }
  #along-cover-designs .al-poster .al-post-content { padding: 24px 21px; }
  #along-cover-designs .al-poster .al-title { font-size: 26px; line-height: 1.45; letter-spacing: -.7px; margin-bottom: 14px; }
  #along-cover-designs .al-poster .al-meta, #along-cover-designs .al-poster .al-description, #along-cover-designs .al-poster .al-post-footer, #along-cover-designs .al-poster .al-read { color: #f0eaf5; }
  #along-cover-designs .al-poster-label { position: absolute; top: 18px; left: 18px; font-size: 10px; letter-spacing: 1.5px; padding: 5px 10px; border: 1px solid #ffffff75; border-radius: 30px; background: #282e47; }
  #along-cover-designs .al-poster-site .al-column:nth-child(2) { padding-top: 27px; }
  #along-cover-designs .al-feature { margin-bottom: var(--al-gap); display: grid; grid-template-columns: 1.05fr 1fr; min-height: 300px; background: #faf7f0; }
  #along-cover-designs .al-feature .al-image { aspect-ratio: auto; min-height: 300px; background-position: 44% center; }
  #along-cover-designs .al-feature .al-post-content { padding: 25px 21px; display: flex; flex-direction: column; align-items: start; justify-content: center; }
  #along-cover-designs .al-feature .al-title { font-size: 26px; line-height: 1.45; margin: 15px 0 13px; }
  #along-cover-designs .al-feature .al-post-footer { width: 100%; margin-top: 28px; }
  #along-cover-designs .al-feature-index { color: var(--al-violet); letter-spacing: 1.5px; font-size: 10px; margin-bottom: 9px; }
  #along-cover-designs .al-editorial-site .al-column:nth-child(2) { padding-top: 30px; }
  @media (max-width: 900px) {
    #along-cover-designs .al-site { grid-template-columns: 125px minmax(0, 1fr); padding: 25px 22px; gap: 23px; min-height: 1110px; }
    #along-cover-designs .al-right { display: none; }
  }
  @media (max-width: 600px) {
    #along-cover-designs .al-site { display: block; padding: 17px; min-height: 1460px; }
    #along-cover-designs .al-left { display: flex; gap: 14px; align-items: center; padding: 0 0 20px; }
    #along-cover-designs .al-portrait { width: 52px; height: 52px; flex: 0 0 52px; margin: 0; }
    #along-cover-designs .al-status { width: 25px; height: 25px; font-size: 14px; right: -5px; }
    #along-cover-designs .al-name { font-size: 20px; }
    #along-cover-designs .al-sign { margin: 0; }
    #along-cover-designs .al-nav, #along-cover-designs .al-social { display: none; }
    #along-cover-designs .al-inspiration { padding: 17px; }
    #along-cover-designs .al-quote { margin: 13px 0 17px; font-size: 23px; }
    #along-cover-designs .al-flow { display: block; }
    #along-cover-designs .al-column { display: contents; }
    #along-cover-designs .al-post { margin-bottom: var(--al-gap); }
    #along-cover-designs .al-flow { display: flex; flex-direction: column; gap: 0; }
    #along-cover-designs .al-post { width: 100%; }
    #along-cover-designs .al-post[data-order="0"] { order: 0; }
    #along-cover-designs .al-post[data-order="1"] { order: 1; }
    #along-cover-designs .al-post[data-order="2"] { order: 2; }
    #along-cover-designs .al-post[data-order="3"] { order: 3; }
    #along-cover-designs .al-post[data-order="4"] { order: 4; }

<script>
(() => {

  const posts = [
    { date: '2026.10.17', short: '10.17', category: '自我剖析', title: '学会做一个松弛感拉满的人', description: '事情还悬而未决，但是我不会跟着一起悬在那里', time: '3 分钟阅读', tags: '#自我剖析' },

    { date: '2026.07.23', short: '07.23', category: '看剧', title: '《心跳漏一拍》全系列看剧有感', description: '', time: '', tags: '#生活记录' }
  ];
  const meta = p => `<div class="al-meta"><span>${p.date}</span><span>${p.category}</span></div>`;
  const content = p => `${meta(p)}<h3 class="al-title">${p.title}</h3>${p.description ? `<p class="al-description">${p.description}</p>` : ''}<div class="al-post-footer"><span>${p.time || p.tags}</span><span class="al-read">阅读全文 ↗</span></div>`;
  function card(index, mode = '') {
    const p = posts[index];
    return `<article class="al-post ${mode === 'poster' ? 'al-poster' : ''} ${mode === 'feature' ? 'al-feature' : ''}" data-order="${index}">${mode === 'image' || mode === 'feature' ? '<div class="al-image" role="img" aria-label="夜晚，窗边休息的人和熟睡的小猫"></div>' : ''}${mode === 'poster' ? '<span class="al-poster-label">LIFE · 生活切片</span>' : ''}<div class="al-post-content">${mode === 'feature' ? '<div class="al-feature-index">COVER STORY / 封面故事</div>' : ''}${content(p)}</div></article>`;
  }
  const left = `<aside class="al-left"><div class="al-portrait" role="img" aria-label="ALong 的头像"><span class="al-status">🧋</span></div><div><div class="al-name">ALong<span class="al-dot">。</span></div><div class="al-sign">持续发疯ing</div></div><nav class="al-nav" aria-label="主导航预览"><span class="al-current">↳ &nbsp;首页</span><span>Writing</span><span>Projects</span><span>About</span><span>Now</span><span>搜索</span></nav><div class="al-social">GitHub ↗ &nbsp; Email ↗</div></aside>`;

  const hero = `<section class="al-inspiration"><div class="al-inspiration-top"><span class="al-eyebrow">✦ &nbsp; 今日灵感</span><span class="al-date">10月18日 星期日</span></div><div class="al-quote">本以高难饱，徒劳恨费声。</div><div class="al-inspiration-bottom"><span>— 蝉 · 一言 ↗</span><span class="al-read-random">翻阅文章 ↗</span></div></section>`;
  const heading = `<header class="al-section-head"><div><div class="al-eyebrow">WRITING</div><h2>最近文章</h2></div><span class="al-all">全部 Writing ↗</span></header>`;
  const layouts = [
    `<div class="al-flow"><div class="al-column">${card(0, 'image')}${card(3)}</div><div class="al-column">${card(1)}${card(2)}${card(4)}</div></div>`,
    `<div class="al-flow"><div class="al-column">${card(0, 'poster')}${card(3)}</div><div class="al-column">${card(1)}${card(2)}${card(4)}</div></div>`,
    `${card(0, 'feature')}<div class="al-flow"><div class="al-column">${card(1)}${card(4)}</div><div class="al-column">${card(2)}${card(3)}</div></div>`
  ];
  const classes = ['al-natural-site', 'al-poster-site', 'al-editorial-site'];
  Array.from(root.children).forEach((section, index) => {
    section.innerHTML = `<div class="al-site ${classes[index]}" aria-label="${section.dataset.variant}卡片布局">${left}<main class="al-center">${hero}${heading}${layouts[index]}</main>${right}</div>`;
    const site = section.querySelector('.al-site');
    const state = { gap: 18, coverRatio: 1.33 };
    function render() {
      site.style.setProperty('--al-gap', `${state.gap}px`);
      site.style.setProperty('--al-ratio', state.coverRatio);
    }
    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: site, onChange: render });
      tweak.addSlider(state, 'gap', { label: '卡片间距', min: 12, max: 32, step: 2, unit: 'px' });
      if (index === 0) tweak.addSlider(state, 'coverRatio', { label: '封面宽高比', min: 1, max: 1.8, step: 0.05 });
    }
  });
})();
</script>
