baseURL: "https://alongsite.netlify.app"
defaultContentLanguage: "zh"
languages:
  zh:
    locale: "zh-CN"
    label: "简体中文"
    weight: 1
title: "ALong | Site"
theme: "along"
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true
timeZone: "Asia/Shanghai"

pagination:
  pagerSize: 10
  path: page
  disableAliases: false

taxonomies:
  category: categories
  tag: tags

permalinks:
  writing: /writing/:sections[1]/:slug/
  projects: /projects/:slug/

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

params:
  author: "ALong"
  avatar: "/images/IMG_5943.JPG"
  profile_photo: "/images/portrait.jpg" # 个人简介照片；填写 /images/portrait.jpg 等真实资源路径
  signature: "持续发疯ing"
  status:
    emoji: "🧋"
    text: "喝奶茶中"
  role: "AI 探索者 & 感受生活的普通人"
  description: "关于技术、创造与生活的记录集。"
  introduction: "我在探索 AI 领域有意思的技术方向，也记录那些值得被慢慢想清楚的事情。"
  defaultImage: "/images/og-default.svg"
  email: "1458169154@qq.com"
  github: "https://github.com/Blooming-LHL"
  resume: ""
  siteNote: "记录技术，也感受生活。"

menu:
  main:
    - name: "个人主页"
      pageRef: "/"
      weight: 10
    - name: "我的博客"
      pageRef: "/blog"
      weight: 30
    - name: "全部文章"
      pageRef: "/writing"
      weight: 40
    - name: "现在"
      pageRef: "/now"
      weight: 50
    - name: "搜索"
      pageRef: "/search"
      weight: 60

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: github-dark
  tableOfContents:
    startLevel: 2
    endLevel: 3

privacy:
  googleAnalytics:
    disable: true
