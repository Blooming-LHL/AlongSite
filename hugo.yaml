baseURL: "https://example.com/"
defaultContentLanguage: "zh"
languages:
  zh:
    locale: "zh-CN"
    label: "简体中文"
    weight: 1
title: "沿途"
theme: "along"
enableRobotsTXT: true
enableGitInfo: false
hasCJKLanguage: true
timeZone: "Asia/Shanghai"

pagination:
  pagerSize: 10
  path: page
  disableAliases: false

taxonomies:
  category: categories
  tag: tags

permalinks:
  writing: /writing/:sections[1]/:slug/
  projects: /projects/:slug/

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
  taxonomy: [HTML, RSS]
  term: [HTML, RSS]

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

params:
  brand: "沿途"
  author: "梁恒龙"
  role: "AI 探索者 & 感受生活的普通人"
  description: "关于技术、创造与生活的记录集。"
  introduction: "我在探索 AI 领域有意思的技术方向，也记录那些值得被慢慢想清楚的事情。"
  defaultImage: "/images/og-default.svg"
  email: "1458169154@qq.com"
  github: "https://github.com/Blooming-LHL"
  resume: ""
  siteNote: "这是一个可替换的 Hugo MVP 示例站点。"

menu:
  main:
    - name: "首页"
      pageRef: "/"
      weight: 10
    - name: "Writing"
      pageRef: "/writing"
      weight: 20
    - name: "Projects"
      pageRef: "/projects"
      weight: 30
    - name: "About"
      pageRef: "/about"
      weight: 40
    - name: "Now"
      pageRef: "/now"
      weight: 50

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 3

privacy:
  googleAnalytics:
    disable: true
